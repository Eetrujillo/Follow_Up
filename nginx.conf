# Gateway for the Follow-Up SPA. Mounted as /etc/nginx/conf.d/default.conf, so
# this is a server block, not a full nginx.conf.
server {
    # Must match the container side of the compose port mapping (3202).
    listen 3202;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Document payloads travel through the API; keep the default 1m from
    # rejecting normal requests with a 413 before they ever reach Nest.
    client_max_body_size 25m;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css application/javascript application/json
               image/svg+xml font/woff font/woff2;

    # The session token lives in localStorage, which any injected script can read.
    # Until the token moves to an HttpOnly cookie, refusing to load scripts from
    # anywhere but our own origin is what keeps an injection from becoming a
    # session theft. 'unsafe-inline' is limited to styles: Angular emits them for
    # host bindings, and styles cannot read the token.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "same-origin" always;

    # API. proxy_pass has NO trailing slash on purpose: it would strip the /api
    # prefix and the backend, which mounts everything under /api
    # (app.setGlobalPrefix('api')), would answer every call with a 404.
    location /api/ {
        proxy_pass http://backend:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # The hashed bundle never changes under the same name. `expires` instead of
    # add_header on purpose: a location that declares add_header stops inheriting
    # the server-level security headers, which is how a CSP silently disappears
    # from the page that matters.
    location ~* \.(?:js|css|woff2?|ttf|eot|svg|png|jpe?g|gif|webp|ico)$ {
        expires 7d;
        try_files $uri =404;
    }

    # index.html must not be cached: a stale shell keeps pointing at bundle
    # hashes that no longer exist after a deploy. expires -1 means "revalidate".
    location = /index.html {
        expires -1;
    }

    # Angular Router owns every other path; unknown paths must return the shell
    # instead of a 404 so a deep link survives a page reload.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
